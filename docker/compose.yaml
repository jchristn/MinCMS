services:
  less3:
    image: jchristn77/less3:v2.2.0
    container_name: less3
    ports:
      - "8000:8000"
    stdin_open: true
    tty: true
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mkdir -p /app/db /app/disk /app/logs /app/temp
        if [ ! -f /app/db/less3.db ]; then
          rm -f /app/db/less3.db-shm /app/db/less3.db-wal /app/db/less3.db-journal
          cp -R /seed/db/. /app/db/
        fi
        if [ -z "$(ls -A /app/disk 2>/dev/null)" ]; then
          cp -R /seed/disk/. /app/disk/
        fi
        if [ -z "$(ls -A /app/logs 2>/dev/null)" ]; then
          cp -R /seed/logs/. /app/logs/
        fi
        if [ -z "$(ls -A /app/temp 2>/dev/null)" ]; then
          cp -R /seed/temp/. /app/temp/
        fi
        exec dotnet Less3.dll
    volumes:
      - ./less3/system.json:/app/system.json
      - ./less3/db:/app/db
      - ./less3/logs:/app/logs
      - ./less3/temp:/app/temp
      - ./less3/disk:/app/disk
      - ./factory/less3_database:/seed/db:ro
      - ./factory/less3_disk:/seed/disk:ro
      - ./factory/less3_logs:/seed/logs:ro
      - ./factory/less3_temp:/seed/temp:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '' http://localhost:8000 ; test $$? -ne 7"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  less3-ui:
    image: jchristn77/less3-ui:v2.2.0
    container_name: less3-ui
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
    environment:
      TERM: xterm-256color
      LESS3_SERVER_URL: http://localhost:8000
    depends_on:
      less3:
        condition: service_healthy
    restart: unless-stopped

  mincms-server:
    image: jchristn77/mincms-server:v0.1.0
    container_name: mincms-server
    ports:
      - "8200:8200"
    volumes:
      - ./server/mincms.json:/app/mincms.json
      - ./server/logs:/app/logs
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      WEBSERVER_HOSTNAME: "*"
      WEBSERVER_PORT: "8200"
      S3_ACCESS_KEY: default
      S3_SECRET_KEY: default
      S3_BUCKET: default
      S3_REGION: us-west-1
      S3_ENDPOINT: http://less3:8000
      S3_USE_SSL: "false"
      S3_REQUEST_STYLE: PathStyle
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8200/"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 5s
    depends_on:
      less3:
        condition: service_healthy
    restart: unless-stopped

  mincms-dashboard:
    image: jchristn77/mincms-dashboard:v0.1.0
    container_name: mincms-dashboard
    ports:
      - "8300:8300"
    environment:
      MINCMS_SERVER_URL: http://localhost:8200
      MINCMS_LOGO_FILE: ""
      MINCMS_LOGO_NOTEXT_FILE: ""
      MINCMS_FAVICON_FILE: ""
    depends_on:
      mincms-server:
        condition: service_healthy
    restart: unless-stopped
